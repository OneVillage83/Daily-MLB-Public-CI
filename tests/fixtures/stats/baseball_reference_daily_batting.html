<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sanitized daily batting</title></head>
<body>
<table id="daily">
  <thead><tr>
    <th data-stat="ranker">Rk</th><th data-stat="name_display">Name</th>
    <th data-stat="age">Age</th><th data-stat="number_of_days">#days</th>
    <th data-stat="level">Lev</th><th data-stat="team_name">Tm</th>
    <th data-stat="games">G</th><th data-stat="plate_appearances">PA</th>
    <th data-stat="at_bats">AB</th><th data-stat="runs">R</th>
    <th data-stat="hits">H</th><th data-stat="doubles">2B</th>
    <th data-stat="triples">3B</th><th data-stat="home_runs">HR</th>
    <th data-stat="runs_batted_in">RBI</th><th data-stat="bases_on_balls">BB</th>
    <th data-stat="intentional_bases_on_balls">IBB</th><th data-stat="strikeouts">SO</th>
    <th data-stat="hit_by_pitch">HBP</th><th data-stat="sacrifice_hits">SH</th>
    <th data-stat="sacrifice_flies">SF</th><th data-stat="grounded_into_double_plays">GDP</th>
    <th data-stat="stolen_bases">SB</th><th data-stat="caught_stealing">CS</th>
    <th data-stat="batting_avg">BA</th><th data-stat="onbase_perc">OBP</th>
    <th data-stat="slugging_perc">SLG</th><th data-stat="onbase_plus_slugging">OPS</th>
  </tr></thead>
  <tbody>
    <tr><th data-stat="ranker">1</th>
      <td data-stat="name_display"><a href="/redirect.fcgi?player=1&amp;mlb_ID=660271">Example Hitter</a></td>
      <td data-stat="age">27</td><td data-stat="number_of_days">1</td><td data-stat="level">MLB</td><td data-stat="team_name">LAD</td>
      <td data-stat="games">1</td><td data-stat="plate_appearances">4</td><td data-stat="at_bats">4</td><td data-stat="runs">1</td>
      <td data-stat="hits">2</td><td data-stat="doubles">1</td><td data-stat="triples">0</td><td data-stat="home_runs">0</td>
      <td data-stat="runs_batted_in">1</td><td data-stat="bases_on_balls">0</td><td data-stat="intentional_bases_on_balls">0</td>
      <td data-stat="strikeouts">1</td><td data-stat="hit_by_pitch">0</td><td data-stat="sacrifice_hits">0</td>
      <td data-stat="sacrifice_flies">0</td><td data-stat="grounded_into_double_plays">0</td><td data-stat="stolen_bases">0</td>
      <td data-stat="caught_stealing">0</td><td data-stat="batting_avg">.500</td><td data-stat="onbase_perc">.500</td>
      <td data-stat="slugging_perc">.750</td><td data-stat="onbase_plus_slugging">1.250</td>
    </tr>
  </tbody>
</table>
</body>
</html>
