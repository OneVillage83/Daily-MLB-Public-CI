<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sanitized daily pitching</title></head>

    <th data-stat="whip">WHIP</th><th data-stat="batting_avg_balls_in_play">BAbip</th>
    <th data-stat="strikeouts_per_nine">SO9</th><th data-stat="strikeouts_per_walk">SO/W</th>
