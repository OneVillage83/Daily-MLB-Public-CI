name: gamestate-source-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe authoritative MLB game-feed structure
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch live/gamestate-source-probe-20260726 https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          cd source
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          .venv/bin/python - <<'PY'
          import requests

          headers = {
              "User-Agent": "Daily-MLB-GameState-Probe/1.0",
              "Accept": "application/json",
              "Accept-Encoding": "identity",
          }

          def get_json(url: str, *, params=None):
              response = requests.get(
                  url,
                  params=params,
                  headers=headers,
                  timeout=30,
                  allow_redirects=False,
              )
              print("HTTP", response.status_code, response.url)
              response.raise_for_status()
              return response.json()

          schedule = get_json(
              "https://statsapi.mlb.com/api/v1/schedule",
              params={"sportId": 1, "date": "2026-07-26"},
          )
          games = [game for date in schedule.get("dates", []) for game in date.get("games", [])]
          assert games, "schedule probe returned no games"
          game_pk = games[0]["gamePk"]
          feed = get_json(f"https://statsapi.mlb.com/api/v1.1/game/{game_pk}/feed/live")

          game_data = feed.get("gameData", {})
          live_data = feed.get("liveData", {})
          boxscore = live_data.get("boxscore", {})
          teams = boxscore.get("teams", {})

          print("PROBE_GAME_PK", game_pk)
          print("TOP_LEVEL_KEYS", sorted(feed.keys()))
          print("GAME_DATA_KEYS", sorted(game_data.keys()))
          print("LIVE_DATA_KEYS", sorted(live_data.keys()))
          print("STATUS_KEYS", sorted(game_data.get("status", {}).keys()))
          print("PROBABLE_PITCHER_SIDES", sorted(game_data.get("probablePitchers", {}).keys()))
          print("GAME_DATA_PLAYER_COUNT", len(game_data.get("players", {})))
          print("BOXSCORE_KEYS", sorted(boxscore.keys()))

          for side in ("away", "home"):
              team = teams.get(side, {})
              print(f"{side.upper()}_TEAM_KEYS", sorted(team.keys()))
              print(f"{side.upper()}_BATTERS_COUNT", len(team.get("batters", [])))
              print(f"{side.upper()}_PITCHERS_COUNT", len(team.get("pitchers", [])))
              print(f"{side.upper()}_BENCH_COUNT", len(team.get("bench", [])))
              print(f"{side.upper()}_BULLPEN_COUNT", len(team.get("bullpen", [])))
              order = team.get("battingOrder", [])
              print(f"{side.upper()}_BATTING_ORDER_COUNT", len(order))
              print(f"{side.upper()}_BATTING_ORDER", order)
              players = team.get("players", {})
              print(f"{side.upper()}_BOXSCORE_PLAYER_COUNT", len(players))
              if order:
                  key = f"ID{order[0]}"
                  player = players.get(key, game_data.get("players", {}).get(key, {}))
                  print(f"{side.upper()}_FIRST_ORDER_PLAYER_KEYS", sorted(player.keys()))
                  print(f"{side.upper()}_FIRST_ORDER_PERSON_KEYS", sorted(player.get("person", {}).keys()))
                  print(f"{side.upper()}_FIRST_ORDER_POSITION_KEYS", sorted(player.get("position", {}).keys()))

          print("SOURCE_PROBE_OK")
          PY
