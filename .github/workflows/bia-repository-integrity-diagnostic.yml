name: bia-repository-integrity-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-integrity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Focused BIA repository integrity
        run: >-
          python -m pytest -q
          tests/test_baseball_intelligence_contracts.py
          tests/test_baseball_intelligence_assembly.py
          tests/test_baseball_intelligence_artifact.py
          tests/test_baseball_intelligence_selector.py
          tests/test_baseball_intelligence_repository.py
          tests/test_baseball_intelligence_repository_integrity.py
          tests/test_baseball_intelligence_migration_v10_roundtrip.py
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy --no-incremental
