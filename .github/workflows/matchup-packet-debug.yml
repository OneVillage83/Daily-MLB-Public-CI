name: matchup-packet-debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  matchup-packet:
    runs-on: windows-latest
    steps:
      - name: Focused MatchupPacket diagnostics
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch debug/matchup-packet-v1-r1 https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          Set-Location source
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_matchup_packet.py tests/test_matchup_packet_artifact.py
          py -3.12 -m ruff check app/matchup_packet tests/test_matchup_packet.py tests/test_matchup_packet_artifact.py
          py -3.12 -m mypy
