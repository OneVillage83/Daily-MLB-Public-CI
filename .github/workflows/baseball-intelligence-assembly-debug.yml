name: baseball-intelligence-assembly-debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  baseball-intelligence:
    runs-on: windows-latest
    steps:
      - name: Focused Baseball Intelligence Assembly diagnostics
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch debug/baseball-intelligence-assembly-v1-r2 https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          Set-Location source
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_baseball_intelligence_assembly.py tests/test_baseball_intelligence_artifact.py
          py -3.12 -m ruff check app/baseball_intelligence tests/test_baseball_intelligence_assembly.py tests/test_baseball_intelligence_artifact.py
          py -3.12 -m mypy
