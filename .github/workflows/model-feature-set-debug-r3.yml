name: model-feature-set-debug-r3

on:
  pull_request:

permissions:
  contents: read

jobs:
  model-feature-set:
    runs-on: windows-latest
    steps:
      - name: Focused ModelFeatureSet diagnostics
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch debug/model-feature-set-v1-r3 https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          Set-Location source
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_model_feature_set.py tests/test_model_feature_set_artifact.py tests/test_model_feature_set_v3_integration.py
          py -3.12 -m ruff check app/model_feature_set tests/test_model_feature_set.py tests/test_model_feature_set_artifact.py tests/test_model_feature_set_v3_integration.py
          py -3.12 -m mypy
