name: gamestate-raw-link-debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  gamestate:
    runs-on: windows-latest
    steps:
      - name: Focused GameState raw-link diagnostics
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch debug/gamestate-raw-link https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          Set-Location source
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_game_state_contracts.py tests/test_game_state_artifact.py tests/test_game_state_acquisition.py tests/test_game_state_batch.py tests/test_game_state_raw_link.py
          py -3.12 -m ruff check app/game_state tests/test_game_state_contracts.py tests/test_game_state_artifact.py tests/test_game_state_acquisition.py tests/test_game_state_batch.py tests/test_game_state_raw_link.py
          py -3.12 -m mypy
