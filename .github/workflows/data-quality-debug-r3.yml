name: data-quality-debug-r3

on:
  pull_request:

permissions:
  contents: read

jobs:
  data-quality:
    runs-on: windows-latest
    steps:
      - name: Focused Data Quality diagnostics
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch debug/data-quality-v1-r3 https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          Set-Location source
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_data_quality_rules.py tests/test_data_quality_contracts.py tests/test_data_quality_engine.py
          py -3.12 -m ruff check app/data_quality tests/test_data_quality_rules.py tests/test_data_quality_contracts.py tests/test_data_quality_engine.py
          py -3.12 -m mypy
