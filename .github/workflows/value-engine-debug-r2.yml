name: value-engine-debug-r2

on:
  pull_request:

permissions:
  contents: read

jobs:
  value-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Focused Value Engine diagnostics
        shell: pwsh
        run: |
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_value_engine.py tests/test_value_engine_artifact.py
          py -3.12 -m ruff check app/value_engine tests/test_value_engine.py tests/test_value_engine_artifact.py
          py -3.12 -m mypy
