name: bia-v10-fixture-diagnostic

on:
  pull_request:
  push:
    branches:
      - "rc/bia-v10-fixture-diagnostic-20260730"

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Schema-v10 fixture and upstream regression
        run: >-
          python -m pytest -q
          tests/test_baseball_intelligence_migration_v10_roundtrip.py
          tests/test_baseball_intelligence_migration_v10.py
          tests/test_migrations.py
          tests/test_daily_slate_persistence.py
          tests/test_daily_slate_contracts.py
          tests/test_game_state_repository.py
          tests/test_game_state_artifact.py
          tests/test_baseball_intelligence_assembly.py
          tests/test_baseball_intelligence_artifact.py
          tests/test_run_controller_persistence.py
          tests/test_docker_release_contract.py
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy --no-incremental
