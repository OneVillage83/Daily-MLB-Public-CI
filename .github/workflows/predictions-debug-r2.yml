name: predictions-debug-r2

on:
  pull_request:

permissions:
  contents: read

jobs:
  predictions:
    runs-on: windows-latest
    steps:
      - name: Focused Predictions diagnostics
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch debug/predictions-v1-r2 https://github.com/OneVillage83/Daily-MLB-Public-CI.git source
          Set-Location source
          py -3.12 --version
          py -3.12 -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-dev.txt
          py -3.12 -m pytest -q tests/test_predictions.py tests/test_predictions_artifact.py tests/test_predictions_identity.py tests/test_predictions_v3_integration.py
          py -3.12 -m ruff check app/predictions tests/test_predictions.py tests/test_predictions_artifact.py tests/test_predictions_identity.py tests/test_predictions_v3_integration.py
          py -3.12 -m mypy
